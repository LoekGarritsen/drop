services:
  drop-demo:
    build: .
    image: drop:local
    container_name: drop-demo
    restart: unless-stopped
    ports:
      - "8301:8300"
    volumes:
      - ./data:/data
    environment:
      # Public demo: 10 MiB per item, 1 hour default TTL, 1 day max. The host
      # wipes ./data hourly on cron; the client shows a banner while DEMO is set.
      DEMO: "1"
      MAX_ITEM_BYTES: "10485760"
      DEFAULT_TTL_S: "3600"
      MAX_TTL_S: "86400"
    mem_limit: 256m
