name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: End-to-end tests
        run: |
          PORT=8399 DATA_DIR=/tmp/drop-test node server.js &
          for i in $(seq 1 20); do
            wget -qO- http://127.0.0.1:8399/api/meta >/dev/null 2>&1 && break
            sleep 0.5
          done
          npm test
