name: Test and deploy drop to hermes

# Stack lives on hermes (/docker/drop) and the runner pool runs on hermes too,
# so tests run in a sibling node container and deploy is a local rsync.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-drop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, homelab, docker]
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      # The runner is a container on the host daemon, so sibling mounts must be
      # real host paths. /docker is bind-mounted into the runner, stage there.
      - name: Run end-to-end tests
        run: |
          CI_DIR="/docker/_ci-drop-${{ github.run_id }}"
          rm -rf "$CI_DIR"; mkdir -p "$CI_DIR"
          rsync -a --exclude 'data/' src/ "$CI_DIR/"
          trap 'rm -rf "$CI_DIR"' EXIT
          docker run --rm -v "$CI_DIR:/app" -w /app node:26-alpine sh -c '
            PORT=8399 DATA_DIR=/tmp/drop-test node server.js & 
            for i in $(seq 1 20); do wget -qO- http://127.0.0.1:8399/api/meta >/dev/null 2>&1 && break; sleep 0.5; done
            npm test'

      - name: Sync into live stack
        run: |
          rsync -a --delete --exclude 'data/' --exclude '.git/' src/ /docker/drop/

      # Runner is a container: 127.0.0.1 is itself, so probe the host LAN IP.
      - name: Rebuild and restart container
        working-directory: /docker/drop
        run: |
          docker compose up -d --build
          for i in $(seq 1 20); do
            curl -fsS http://192.168.2.211:8300/api/meta >/dev/null && exit 0; sleep 1
          done
          echo "drop did not come up"; docker compose logs --tail 30; exit 1
